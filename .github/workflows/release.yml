name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in "x64", "arm64") {
            dotnet publish Focus-Timer/Focus-Timer.csproj `
              -c Release `
              -p:Platform=$arch `
              -r win-$arch `
              -p:PublishProfile=win-$arch `
              -p:WindowsPackageType=None `
              -p:WindowsAppSDKSelfContained=true `
              -o "publish/$arch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Compress-Archive -Path "publish/$arch/*" -DestinationPath "dist/Focus-Timer-${{ github.ref_name }}-$arch.zip"
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist/*.zip).FullName --title "${{ github.ref_name }}" --generate-notes
